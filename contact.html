<body class="contact-page">

<header>
  <div class="logo">
    <span style="--i:1;">F</span><span style="--i:2;">A</span><span style="--i:3;">T</span>
    <span class="space">&</span>
    <span style="--i:4;">F</span><span style="--i:5;">I</span><span style="--i:6;">T</span>
  </div>

  <div class="menu-toggle" id="mobile-menu">
    <span class="bar"></span>
    <span class="bar"></span>
    <span class="bar"></span>
  </div>

  <nav class="nav-menu">
    <ul>
      <li><a href="index.html">Home</a></li>

      <li><a href="contact.html" class="active">Kontakt</a></li>

</header>

<main class="content-page">
  <section class="contact-section">
    <h1>Kontakt</h1>
    <p class="subtitle">Starte jetzt deine Transformation – Nimm Kontakt auf</p>

    <div class="contact-container">
      <form id="contact-form">
        <div class="form-group">
          <label for="name">Name:</label>
          <input type="text" id="name" placeholder="Dein vollständiger Name" required>
        </div>
        <div class="form-group">
          <label for="email">E-Mail:</label>
          <input type="email" id="email" placeholder="deine.email@example.com" required>
        </div>
        <div class="form-group">
          <label for="message">Nachricht:</label>
          <textarea id="message" rows="5" placeholder="Schreibe dein Anliegen oder Wunsch-Paket..." required></textarea>
        </div>
        <button type="submit" class="cta-btn" style="width: 100%;">Nachricht senden</button>
      </form>
    </div>
  </section>
</main>

<footer>
  <p>&copy; 2026 Fat & Fit Trainer. Alle Rechte vorbehalten.</p>
